<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aero Chess Open — Season 1</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-badge">♟ Season 1</div>
    <h1>Aero Chess Open</h1>
    <p class="tagline">3rd Year Aerospace Engineering Chess Tournament</p>
    <div class="event-facts">
      <div class="fact"><span class="fact-label">Date</span><span id="event-date">—</span></div>
      <div class="fact"><span class="fact-label">Venue</span><span id="event-venue">—</span></div>
      <div class="fact"><span class="fact-label">Format</span><span id="event-time-control">—</span></div>
      <div class="fact"><span class="fact-label">Entry Fee</span><span id="event-fee">—</span></div>
    </div>
  </div>
</header>

<main class="container">

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="stat-registered">0</div>
      <div class="stat-label">Registered Players</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-paid">0</div>
      <div class="stat-label">Paid Players</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-collected">₹0</div>
      <div class="stat-label">Amount Collected</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-prize">₹0</div>
      <div class="stat-label">Prize Pool</div>
    </div>
  </section>

  <p class="prize-note" id="event-prize-note"></p>

  <section class="panel">
    <div class="panel-header">
      <h2>Standings</h2>
    </div>
    <div class="table-wrap">
      <table class="standings-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Played</th>
            <th>W-D-L</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="5" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Matches</h2>
      <select id="round-filter" aria-label="Filter by round">
        <option value="ALL">All rounds</option>
      </select>
    </div>
    <div id="matches-list" class="matches-list">
      <div class="empty">Loading…</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Players</h2>
      <input id="player-search" type="text" placeholder="Search players…" />
    </div>
    <ul id="players-list" class="players-list">
      <li class="empty">Loading…</li>
    </ul>
  </section>

</main>

<footer class="site-footer">
  <button id="refresh-btn" class="refresh-btn">↻ Refresh now</button>
  <span id="sync-status">Loading…</span>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
