<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aero Chess Open — Season 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { color: #2c3e50; }
    .item { margin-bottom: 12px; }
    .label { font-weight: bold; color: #555; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Aero Chess Open — Season 1</h1>
    <div id="details">Loading event details from Google Sheet...</div>
  </div>

  <script>
    // Replace with your Published CSV URL from Step 1
    const sheetCsvUrl = 'YOUR_PUBLISHED_CSV_URL_HERE';

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const data = {};
      lines.slice(1).forEach(line => {
        const [key, value] = line.split(',').map(item => item.trim().replace(/^"|"$/g, ''));
        if (key) data[key] = value;
      });
      return data;
    }

    async function loadSheetData() {
      try {
        const response = await fetch(sheetCsvUrl);
        const csvText = await response.text();
        const settings = parseCSV(csvText);

        document.getElementById('details').innerHTML = `
          <div class="item"><span class="label">Event Date:</span> ${settings.eventDate || 'N/A'}</div>
          <div class="item"><span class="label">Venue:</span> ${settings.venue || 'N/A'}</div>
          <div class="item"><span class="label">Entry Fee:</span> ₹${settings.fee || 'N/A'}</div>
          <div class="item"><span class="label">Time Control:</span> ${settings.timeControl || 'N/A'}</div>
          <div class="item"><span class="label">Prize Note:</span> ${settings.prizeNote || 'N/A'}</div>
        `;
      } catch (error) {
        console.error('Error fetching sheet data:', error);
        document.getElementById('details').innerText = 'Failed to load event details.';
      }
    }

    loadSheetData();
  </script>

</body>
</html>
